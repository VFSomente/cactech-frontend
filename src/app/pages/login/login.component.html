<div class="container auth">
  <div class="panel auth-card">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" [class.active]="isLogin" [attr.aria-selected]="isLogin" (click)="toggleForm(true)">
        Entrar
      </button>
      <button type="button" role="tab" [class.active]="!isLogin" [attr.aria-selected]="!isLogin" (click)="toggleForm(false)">
        Criar conta
      </button>
    </div>

    <h1>{{ isLogin ? 'Bem-vindo de volta' : 'Crie sua conta' }}</h1>
    <p class="subtitle">
      {{ isLogin ? 'Entre para acompanhar seus pedidos e finalizar compras.' : 'Leva menos de um minuto.' }}
    </p>

    @if (successMessage) {
      <div class="alert alert-success" role="status">
        <i class="fa-solid fa-circle-check"></i> {{ successMessage }}
      </div>
    }
    @if (errorMessage) {
      <div class="alert alert-error" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i> {{ errorMessage }}
      </div>
    }

    @if (isLogin) {
      <form (ngSubmit)="login()" class="form">
        <div class="field">
          <label for="loginUsername">Usuário</label>
          <input id="loginUsername" class="input" type="text" autocomplete="username" [(ngModel)]="loginUsername" name="loginUsername" required />
        </div>
        <div class="field">
          <div class="label-row">
            <label for="loginPassword">Senha</label>
            <a routerLink="/esqueci-senha" class="forgot">Esqueci a senha</a>
          </div>
          <div class="password">
            <input
              id="loginPassword"
              class="input"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="current-password"
              [(ngModel)]="loginPassword"
              name="loginPassword"
              required
            />
            <button type="button" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'">
              <i [class]="showPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye'"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block" [disabled]="loading">
          @if (loading) { <i class="fa-solid fa-circle-notch fa-spin"></i> Entrando... } @else { Entrar }
        </button>
      </form>
    } @else {
      <form (ngSubmit)="register()" class="form">
        <div class="field">
          <label for="registerName">Nome completo *</label>
          <input id="registerName" class="input" type="text" autocomplete="name" [(ngModel)]="registerName" name="registerName" required />
        </div>
        <div class="row">
          <div class="field">
            <label for="registerUsername">Usuário *</label>
            <input id="registerUsername" class="input" type="text" autocomplete="username" [(ngModel)]="registerUsername" name="registerUsername" required />
          </div>
          <div class="field">
            <label for="registerPhone">Telefone</label>
            <input id="registerPhone" class="input" type="tel" autocomplete="tel" placeholder="(83) 90000-0000" [(ngModel)]="registerPhone" name="registerPhone" />
          </div>
        </div>
        <div class="field">
          <label for="registerEmail">E-mail *</label>
          <input id="registerEmail" class="input" type="email" autocomplete="email" [(ngModel)]="registerEmail" name="registerEmail" required />
        </div>
        <div class="field">
          <label for="registerPassword">Senha *</label>
          <div class="password">
            <input
              id="registerPassword"
              class="input"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="new-password"
              [(ngModel)]="registerPassword"
              name="registerPassword"
              required
            />
            <button type="button" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'">
              <i [class]="showPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye'"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block" [disabled]="loading">
          @if (loading) { <i class="fa-solid fa-circle-notch fa-spin"></i> Criando conta... } @else { Criar conta }
        </button>
      </form>
    }
  </div>
</div>
